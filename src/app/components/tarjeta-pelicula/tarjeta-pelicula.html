<div class="tarjeta-pelicula">
  <img [src]="pelicula.afiche_url" [alt]="pelicula.titulo" />

  <div class="tarjeta-contenido">
    <h3>{{ pelicula.titulo }}</h3>
    <hr>
    <span>⏱️: {{ pelicula.duracion_minutos }} min || 📆: {{ pelicula.estreno }}</span>
    <hr>
    <span class="generos">{{ pelicula.generos }}</span>
    @if (pelicula.restriccion_edad > 0) {
      <div class="restriccion">+{{ pelicula.restriccion_edad }}</div>
    }
  </div>
</div>
