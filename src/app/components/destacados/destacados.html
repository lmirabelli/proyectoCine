<div class="pelicula-destacada">
    <div class="afiche">
        <img [src]="pelicula.afiche_url" [alt]="pelicula.titulo" />
    </div>
    <div class="tarjeta-contenido">
        <hr>
        <span>⏱️: {{ pelicula.duracion_minutos }} min</span>
        <hr>
        <span>📆: {{ pelicula.estreno }}</span>
        <hr>
        <h3>{{ pelicula.titulo }}</h3>
        <p class="sinopsis">{{ pelicula.sinopsis }}</p>
    </div>
</div>
